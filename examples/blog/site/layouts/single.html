{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <time>{{ .Date.Format "2006-01-02" }}</time>
  {{ .Content }}
</article>

<!-- The island: this static page loads its dynamic comments from a
     tako fragment; the fragment carries its own form and re-renders
     itself in place on post. -->
<section id="comments" hx-get="/frag/comments?post={{ .RelPermalink }}" hx-trigger="load" hx-swap="outerHTML">
  <noscript><p>Comments need JavaScript.</p></noscript>
</section>
{{ end }}
