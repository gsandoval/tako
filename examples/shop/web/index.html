<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shop</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    button { cursor: pointer; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .product { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #ddd; }
    #status { color: #b00; min-height: 1.5rem; }
    #signout { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>shop</h1>
    <p id="session-state"><a id="signin" href="/_tako/signin?next=/">sign in</a> to buy.
      <span id="who"></span> <button id="signout">sign out</button></p>
  </header>
  <div id="status"></div>
  <form id="stock" style="display:none; margin:.5rem 0;">
    <input id="p-name" placeholder="product name" required>
    <input id="p-price" type="number" placeholder="price in cents" min="1" required style="width:8rem;">
    <button>stock the shelf</button>
  </form>
  <div id="products">loading…</div>
  <h2>your orders</h2>
  <div id="orders">sign in to see orders.</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
