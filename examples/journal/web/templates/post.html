{{ define "title" }}{{ .Title }} · journal{{ end }}
{{ define "content" }}
<article>
  <h2>{{ .Title }}</h2>
  <time>{{ .Created.Format "January 2, 2006" }}</time>
  <div class="body">{{ markdown .Body }}</div> <!-- goldmark, sanitized by default -->
  {{ template "publish-toggle.html" . }}
</article>
{{ end }}
