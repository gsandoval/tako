{{ define "content" }}
<!-- With JS: the new card swaps in atop #posts, no navigation.
     Without: the same form posts plainly and save answers 303. -->
<form method="post" action="/p" hx-post="/p" hx-target="#posts" hx-swap="afterbegin" hx-on::after-request="this.reset()">
  {{ csrf }}
  <p><input name="title" placeholder="Title" required></p>
  <p><textarea name="body" rows="4" placeholder="Write in markdown…"></textarea></p>
  <p><button>Publish</button></p>
</form>
{{ if not .Posts }}<p>Nothing here yet — write the first post above.</p>{{ end }}
{{ if .Posts }}<p class="count">Showing {{ .Shown }} of {{ .Total }} posts.</p>{{ end }}
<!-- Every box carries the SAME name, which is how HTML says "a set".
     The handler binds it as []string and receives all of them; no
     JavaScript builds this list and none is needed to submit it. -->
<form method="post" action="/p/unpublish">
  {{ csrf }}
  <div id="posts">
  {{ range .Posts }}
    <label><input type="checkbox" name="selected" value="{{ .ID }}"></label>
    {{ template "post-card.html" . }}
  {{ end }}
  </div>
  {{ if .Posts }}<p><button>Unpublish selected</button></p>{{ end }}
</form>
{{ end }}
