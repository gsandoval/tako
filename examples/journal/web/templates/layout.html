<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrfToken }}">
  <title>{{ block "title" . }}journal{{ end }}</title>
  <!-- Assets sit BELOW the depth of Perma's GET /{year}/{slug}: a
       two-segment route beats the site's "/" for every two-segment URL,
       so /assets/site.css would reach Perma and 404. tako warns about
       this (tako/site-shadow); three segments clear it. -->
  <link rel="stylesheet" href="/assets/css/site.9f86d081.css">
  <script src="/assets/js/htmx.min.e209dda5.js" defer></script>
</head>
<!-- hx-headers: every htmx request carries the CSRF token — zero per-form wiring -->
<body hx-headers='{"X-CSRF-Token": "{{ csrfToken }}"}'>
  <header><h1><a href="/">journal</a></h1>
    <nav><a href="/write">write</a> · <a href="/about">about</a> ·
      {{ if signedIn }}<span class="who">{{ with (user).Name }}{{ . }}{{ else }}{{ (user).Email }}{{ end }}</span>
      <form method="post" action="/_tako/api/session/signout" style="display:inline;margin:0"><button class="linkish">sign out</button></form>
      {{ else }}<a href="/_tako/signin?next=/">sign in</a>{{ end }}</nav></header>
  <main>{{ block "content" . }}{{ end }}</main>
</body>
</html>
