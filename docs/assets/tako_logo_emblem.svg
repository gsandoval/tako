<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer Kamon Ring with Double Concentric Hairline (丸に八つ足蛸紋) -->
  <circle cx="80" cy="80" r="74" stroke="#E11D48" stroke-width="3.5" />
  <circle cx="80" cy="80" r="67" stroke="#E11D48" stroke-width="1.25" stroke-dasharray="3.5 3.5" opacity="0.65" />

  <!-- Central Octopus Mantle (蛸頭) with Even-Odd Cutout Eyes -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="
    M58 72 C58 50, 102 50, 102 72 C102 85, 92 90, 80 90 C68 90, 58 85, 58 72 Z
    M69 66.5 A3.5 3.5 0 1 0 69 73.5 A3.5 3.5 0 1 0 69 66.5 Z
    M91 66.5 A3.5 3.5 0 1 0 91 73.5 A3.5 3.5 0 1 0 91 66.5 Z
  " fill="#E11D48" />

  <!-- 8 Radial Tentacle Circuit Pathways with Terminating Micro-Nodes -->
  <!-- 1: Top-Left (North-West) -->
  <path d="M60 64 L42 46 L30 46" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="28" cy="46" r="4" fill="#E11D48" />

  <!-- 2: Top-Right (North-East) -->
  <path d="M100 64 L118 46 L130 46" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="132" cy="46" r="4" fill="#E11D48" />

  <!-- 3: Mid-Left (West) -->
  <path d="M57 77 L38 77 L26 88" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="24" cy="90" r="4" fill="#E11D48" />

  <!-- 4: Mid-Right (East) -->
  <path d="M103 77 L122 77 L134 88" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="136" cy="90" r="4" fill="#E11D48" />

  <!-- 5: Bot-Outer-Left (South-West) -->
  <path d="M72 90 L66 110 L48 122" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="45" cy="124" r="4" fill="#E11D48" />

  <!-- 6: Bot-Outer-Right (South-East) -->
  <path d="M88 90 L94 110 L112 122" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="115" cy="124" r="4" fill="#E11D48" />

  <!-- 7: Bot-Inner-Left (South-South-West) -->
  <path d="M77 90 L74 124 L66 134" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="65" cy="136" r="4" fill="#E11D48" />

  <!-- 8: Bot-Inner-Right (South-South-East) -->
  <path d="M83 90 L86 124 L94 134" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="95" cy="136" r="4" fill="#E11D48" />
</svg>
