<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" fill="none">
  <style>
    .tako-word { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 44px; font-weight: 800; letter-spacing: -0.04em; fill: #09090B; }
    .tako-sub { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #71717A; }
    .tako-kanji { font-family: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif; font-size: 18px; font-weight: 700; fill: #E11D48; }
    .hanko-box { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .tako-word { fill: #F0F6FC; }
      .tako-sub { fill: #8B949E; }
      .tako-kanji { fill: #F43F5E; }
      .hanko-box { fill: #290D14; stroke: #F43F5E; }
    }
  </style>

  <!-- Centered Wave Kamon Emblem (波濤八足紋) -->
  <g transform="translate(8, 8) scale(0.45)">
    <circle cx="80" cy="80" r="73.5" stroke="#E11D48" stroke-width="4.5" />
    <circle cx="80" cy="80" r="67.5" stroke="#E11D48" stroke-width="1" opacity="0.4" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="
      M55 49 C55 25, 105 25, 105 49 C105 62, 95 68, 80 68 C65 68, 55 62, 55 49 Z
      M68 43.8 A4.2 4.2 0 1 0 68 52.2 A4.2 4.2 0 1 0 68 43.8 Z
      M92 43.8 A4.2 4.2 0 1 0 92 52.2 A4.2 4.2 0 1 0 92 43.8 Z
    " fill="#E11D48" />
    <path d="M60 64 C38 60 21 69 20 85 C19 101 36 109 47 98" stroke="#E11D48" stroke-width="8" stroke-linecap="round" />
    <path d="M100 64 C122 60 139 69 140 85 C141 101 124 109 113 98" stroke="#E11D48" stroke-width="8" stroke-linecap="round" />
    <path d="M65 68 C46 75 36 94 40 112 C43 124 59 125 67 114" stroke="#E11D48" stroke-width="7.5" stroke-linecap="round" />
    <path d="M95 68 C114 75 124 94 120 112 C117 124 101 125 93 114" stroke="#E11D48" stroke-width="7.5" stroke-linecap="round" />
    <path d="M71 69 C60 84 50 104 63 122 C69 130 81 126 81 115" stroke="#E11D48" stroke-width="7" stroke-linecap="round" />
    <path d="M89 69 C100 84 110 104 97 122 C91 130 79 126 79 115" stroke="#E11D48" stroke-width="7" stroke-linecap="round" />
    <path d="M76 69 C75 82 67 98 73 110" stroke="#E11D48" stroke-width="6.5" stroke-linecap="round" />
    <path d="M84 69 C85 82 93 98 87 110" stroke="#E11D48" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark + Hanko Stamp -->
  <text x="94" y="52" class="tako-word">tako</text>
  <rect x="210" y="24" width="30" height="30" rx="4" class="hanko-box" />
  <text x="216" y="45" class="tako-kanji">蛸</text>
  <text x="96" y="72" class="tako-sub">POLYGLOT CLOUD RUNTIME · GO &amp; CFIRE</text>
</svg>
