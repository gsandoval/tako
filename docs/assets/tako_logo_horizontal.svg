<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" fill="none">
  <style>
    .tako-word { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 44px; font-weight: 800; letter-spacing: -0.04em; fill: #09090B; }
    .tako-sub { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #71717A; }
    .tako-kanji { font-family: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif; font-size: 18px; font-weight: 700; fill: #E11D48; }
    .hanko-box { fill: #FFF1F2; stroke: #E11D48; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .tako-word { fill: #F0F6FC; }
      .tako-sub { fill: #8B949E; }
      .tako-kanji { fill: #F43F5E; }
      .hanko-box { fill: #290D14; stroke: #F43F5E; }
    }
  </style>

  <!-- Kamon Emblem -->
  <g transform="translate(8, 8) scale(0.45)">
    <circle cx="80" cy="80" r="74" stroke="#E11D48" stroke-width="4" />
    <circle cx="80" cy="80" r="66" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="
      M58 72 C58 50, 102 50, 102 72 C102 85, 92 90, 80 90 C68 90, 58 85, 58 72 Z
      M69 66 A4 4 0 1 0 69 74 A4 4 0 1 0 69 66 Z
      M91 66 A4 4 0 1 0 91 74 A4 4 0 1 0 91 66 Z
    " fill="#E11D48" />
    <path d="M60 64 L42 46 L30 46" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="46" r="4.5" fill="#E11D48" />
    <path d="M100 64 L118 46 L130 46" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="132" cy="46" r="4.5" fill="#E11D48" />
    <path d="M57 77 L38 77 L26 88" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="90" r="4.5" fill="#E11D48" />
    <path d="M103 77 L122 77 L134 88" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="136" cy="90" r="4.5" fill="#E11D48" />
    <path d="M72 90 L66 110 L48 122" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="124" r="4.5" fill="#E11D48" />
    <path d="M88 90 L94 110 L112 122" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="115" cy="124" r="4.5" fill="#E11D48" />
    <path d="M77 90 L74 124 L66 134" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="65" cy="136" r="4.5" fill="#E11D48" />
    <path d="M83 90 L86 124 L94 134" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="95" cy="136" r="4.5" fill="#E11D48" />
  </g>

  <!-- Wordmark + Hanko Stamp -->
  <text x="94" y="52" class="tako-word">tako</text>
  <rect x="210" y="24" width="30" height="30" rx="4" class="hanko-box" />
  <text x="216" y="45" class="tako-kanji">蛸</text>
  <text x="96" y="72" class="tako-sub">POLYGLOT CLOUD RUNTIME · GO &amp; CFIRE</text>
</svg>
